apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: psn-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sai7teja/PSN.git'
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: psn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
