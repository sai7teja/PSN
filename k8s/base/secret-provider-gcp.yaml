apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-provider
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/lazybot7/secrets/psn-token/versions/latest"
        fileName: "PSN_TOKEN"
  secretObjects:
    - secretName: gcp-secrets
      type: Opaque
      data:
        - objectName: "PSN_TOKEN"
          key: PSN_TOKEN
